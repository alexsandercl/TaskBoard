<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard - Gerenciador de Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar border-bottom">
    <div class="container">
      <span class="navbar-brand fw-bold mb-0 h1">TaskBoard</span>
      <div class="d-flex gap-2">
        <button id="btn-tema" class="btn btn-sm btn-outline-secondary">Modo escuro</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Resumo -->
    <section class="row g-3 mb-4">
      <div class="col-4">
        <div class="card text-center"><div class="card-body py-3">
          <div class="fs-3 fw-bold" id="total">0</div><small class="text-muted">Total</small>
        </div></div>
      </div>
      <div class="col-4">
        <div class="card text-center"><div class="card-body py-3">
          <div class="fs-3 fw-bold" id="pendentes">0</div><small class="text-muted">Pendentes</small>
        </div></div>
      </div>
      <div class="col-4">
        <div class="card text-center"><div class="card-body py-3">
          <div class="fs-3 fw-bold" id="atrasadas">0</div><small class="text-muted">Atrasadas</small>
        </div></div>
      </div>
      <div class="col-12">
        <div class="progress" style="height: 22px;">
          <div id="progresso" class="progress-bar bg-success" style="width: 0%">0%</div>
        </div>
      </div>
      <div class="col-12 d-flex flex-wrap gap-2" id="por-categoria"></div>
    </section>

    <div class="row g-4">

      <!-- Formulário -->
      <aside class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Nova tarefa</h2>
            <form id="form-tarefa">
              <div class="mb-3">
                <label class="form-label" for="titulo">Título</label>
                <input type="text" id="titulo" class="form-control" required maxlength="80">
              </div>
              <div class="mb-3">
                <label class="form-label" for="categoria">Categoria</label>
                <select id="categoria" class="form-select">
                  <option>Estudos</option>
                  <option>Trabalho</option>
                  <option>Pessoal</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="prioridade">Prioridade</label>
                <select id="prioridade" class="form-select">
                  <option value="1">Baixa</option>
                  <option value="2" selected>Média</option>
                  <option value="3">Alta</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="prazo">Prazo</label>
                <input type="date" id="prazo" class="form-control">
              </div>
              <div class="mb-3">
                <label class="form-label" for="obs">Observações (opcional)</label>
                <textarea id="obs" class="form-control" rows="2" maxlength="300"></textarea>
              </div>
              <button class="btn btn-primary w-100" type="submit">Adicionar tarefa</button>
            </form>
          </div>
        </div>
      </aside>

      <!-- Lista -->
      <section class="col-lg-8">
        <div class="row g-2 mb-3">
          <div class="col-12 col-md-4">
            <input type="search" id="busca" class="form-control" placeholder="Buscar tarefa..." aria-label="Buscar tarefa">
          </div>
          <div class="col-6 col-md-3">
            <select id="filtro-categoria" class="form-select" aria-label="Filtrar por categoria">
              <option value="">Todas as categorias</option>
              <option>Estudos</option>
              <option>Trabalho</option>
              <option>Pessoal</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select id="filtro-status" class="form-select" aria-label="Filtrar por status">
              <option value="todas">Todas</option>
              <option value="pendentes">Pendentes</option>
              <option value="concluidas">Concluídas</option>
            </select>
          </div>
          <div class="col-12 col-md-3">
            <select id="ordenar" class="form-select" aria-label="Ordenar tarefas">
              <option value="prioridade">Ordenar: prioridade</option>
              <option value="prazo">Ordenar: prazo</option>
              <option value="recentes">Ordenar: mais recentes</option>
            </select>
          </div>
        </div>

        <ul id="lista" class="list-group mb-3"></ul>

        <button id="btn-limpar" class="btn btn-sm btn-outline-danger">Limpar concluídas</button>
      </section>
    </div>
  </main>

  <!-- Modal de edição -->
  <div class="modal fade" id="modal-editar" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form-editar">
        <div class="modal-header">
          <h2 class="modal-title h5">Editar tarefa</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          <div class="mb-3">
            <label class="form-label" for="edit-titulo">Título</label>
            <input type="text" id="edit-titulo" class="form-control" required maxlength="80">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label" for="edit-categoria">Categoria</label>
              <select id="edit-categoria" class="form-select">
                <option>Estudos</option><option>Trabalho</option><option>Pessoal</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="edit-prioridade">Prioridade</label>
              <select id="edit-prioridade" class="form-select">
                <option value="1">Baixa</option><option value="2">Média</option><option value="3">Alta</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="edit-prazo">Prazo</label>
              <input type="date" id="edit-prazo" class="form-control">
            </div>
          </div>
          <div>
            <label class="form-label" for="edit-obs">Observações</label>
            <textarea id="edit-obs" class="form-control" rows="3" maxlength="300"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Aviso com opção de desfazer -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="alert" data-bs-delay="6000">
      <div class="toast-body d-flex justify-content-between align-items-center gap-3">
        <span id="toast-msg"></span>
        <button id="btn-desfazer" class="btn btn-sm btn-primary">Desfazer</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
