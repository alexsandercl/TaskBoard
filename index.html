<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <div class="card mx-auto" style="max-width: 600px;">
      <div class="card-body">
        <h1 class="h3 mb-4">Lista de Tarefas</h1>

        <form id="form" class="input-group mb-3">
          <input type="text" id="texto" class="form-control" placeholder="Digite uma tarefa" required>
          <button class="btn btn-primary" type="submit">Adicionar</button>
        </form>

        <ul id="lista" class="list-group mb-3"></ul>

        <div class="d-flex justify-content-between align-items-center">
          <small id="contador" class="text-muted"></small>
          <button id="limpar" class="btn btn-sm btn-outline-danger">Limpar concluídas</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
