<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard - Gerenciador de Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar border-bottom">
    <div class="container">
      <span class="navbar-brand fw-bold mb-0 h1">TaskBoard</span>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">

      <!-- Formulário -->
      <aside class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Nova tarefa</h2>
            <form id="form-tarefa">
              <div class="mb-3">
                <label class="form-label" for="titulo">Título</label>
                <input type="text" id="titulo" class="form-control" required maxlength="80">
              </div>
              <div class="mb-3">
                <label class="form-label" for="categoria">Categoria</label>
                <select id="categoria" class="form-select">
                  <option>Estudos</option>
                  <option>Trabalho</option>
                  <option>Pessoal</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="prioridade">Prioridade</label>
                <select id="prioridade" class="form-select">
                  <option value="1">Baixa</option>
                  <option value="2" selected>Média</option>
                  <option value="3">Alta</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="prazo">Prazo</label>
                <input type="date" id="prazo" class="form-control">
              </div>
              <button class="btn btn-primary w-100" type="submit">Adicionar tarefa</button>
            </form>
          </div>
        </div>
      </aside>

      <!-- Lista -->
      <section class="col-lg-8">
        <ul id="lista" class="list-group mb-3"></ul>
        <button id="btn-limpar" class="btn btn-sm btn-outline-danger">Limpar concluídas</button>
      </section>
    </div>
  </main>

  <!-- Modal de edição -->
  <div class="modal fade" id="modal-editar" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form-editar">
        <div class="modal-header">
          <h2 class="modal-title h5">Editar tarefa</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          <div class="mb-3">
            <label class="form-label" for="edit-titulo">Título</label>
            <input type="text" id="edit-titulo" class="form-control" required maxlength="80">
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="edit-categoria">Categoria</label>
              <select id="edit-categoria" class="form-select">
                <option>Estudos</option><option>Trabalho</option><option>Pessoal</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="edit-prioridade">Prioridade</label>
              <select id="edit-prioridade" class="form-select">
                <option value="1">Baixa</option><option value="2">Média</option><option value="3">Alta</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="edit-prazo">Prazo</label>
              <input type="date" id="edit-prazo" class="form-control">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
